<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Editar música | Minhas Músicas</title>
    <link rel="stylesheet" href="editar.css">
</head>
<body>
    <header>
        <a href="index.html">Voltar para a lista</a>
    </header>

    <main>
        <h1>Editar música</h1>

        <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Ex.: Evidências">
        </div>
        <div class="campo">
            <label for="artista">Artista</label>
            <input type="text" id="artista" placeholder="Ex.: Chitãozinho e Xororó">
        </div>
        <div class="campo">
            <label for="genero">Gênero</label>
            <input type="text" id="genero" placeholder="Ex.: Sertanejo">
        </div>
        <div class="campo">
            <label for="ano">Ano</label>
            <input type="number" id="ano" min="1900" max="2100" placeholder="Ex.: 1990">
        </div>
        <div class="campo">
            <label for="duracao">Duração em minutos</label>
            <input type="number" id="duracao" min="1" placeholder="Ex.: 5">
        </div>

        <button id="botaoSalvar">Salvar alterações</button>
    </main>

    <script src="editar.js"></script>
</body>
</html>
